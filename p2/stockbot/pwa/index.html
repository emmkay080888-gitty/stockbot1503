<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Signal Bot</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Multi-strategy stock market signal consolidation bot">
    <meta name="theme-color" content="#00ff88">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StockBot">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Styles -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0e1117;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0e1117 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #splash.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .splash-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            animation: pulse 2s ease-in-out infinite;
        }
        #splash h1 {
            color: #00ff88;
            font-size: 1.8rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        #splash p {
            color: #8892b0;
            margin-top: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.9rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin-top: 24px;
            border: 3px solid rgba(0, 255, 136, 0.15);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        #offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff4444;
            color: white;
            text-align: center;
            padding: 8px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.85rem;
            z-index: 200;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        #offline-banner.visible {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Offline Banner -->
    <div id="offline-banner">⚠️ No internet connection — showing cached content</div>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="splash-icon">📈</div>
        <h1>Stock Signal Bot</h1>
        <p>Loading your trading dashboard...</p>
        <div class="spinner"></div>
    </div>

    <!-- Streamlit App -->
    <iframe
        id="app-frame"
        src="about:blank"
        allow="camera; microphone; clipboard-read; clipboard-write"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    ></iframe>

    <script>
        // === CONFIGURATION ===
        // Override with ?url=https://your-app.com query param, or use default
        const params = new URLSearchParams(location.search);
        const STREAMLIT_URL = params.get("url") || "http://localhost:8501";

        const iframe = document.getElementById("app-frame");
        const splash = document.getElementById("splash");
        const offlineBanner = document.getElementById("offline-banner");

        // Load the Streamlit app
        iframe.src = STREAMLIT_URL;

        // Hide splash when iframe loads
        iframe.addEventListener("load", () => {
            setTimeout(() => splash.classList.add("hidden"), 400);
        });

        // Fallback: hide splash after 20s regardless
        setTimeout(() => splash.classList.add("hidden"), 20000);

        // Online/offline detection
        window.addEventListener("online", () => offlineBanner.classList.remove("visible"));
        window.addEventListener("offline", () => offlineBanner.classList.add("visible"));

        // Register service worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").then(reg => {
                // Check for updates
                reg.addEventListener("updatefound", () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener("statechange", () => {
                        if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                            // New version available
                            console.log("New version available — refresh to update");
                        }
                    });
                });
            }).catch(() => {});
        }
    </script>
</body>
</html>
